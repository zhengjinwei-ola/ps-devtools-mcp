[program:ps-devtools-mcp]
command=/home/ecs-user/webroot/ps-devtools-mcp/scripts/run-http-service.sh
directory=/home/ecs-user/webroot/ps-devtools-mcp
user=ecs-user
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/ecs-user/webroot/ps-devtools-mcp/logs/http.stdout.log
stderr_logfile=/home/ecs-user/webroot/ps-devtools-mcp/logs/http.stderr.log
